[package]
name = "akamana-backend"
version = "0.4.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
dns-lookup = "2"
flate2 = "1"
http = "1"
jsonwebtoken = "9"
lazy_static = "1.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
once_cell = "1"
openssl = { version = "0.10", features = ["vendored"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
rand_core = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid", "macros"] }
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.18", features = ["derive"] }
# `danger-allow-state-serialisation` is what lets the pending registration /
# authentication state be persisted in `webauthn_challenges` between the start
# and finish halves of a ceremony (rows are single-use and expire in minutes).
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

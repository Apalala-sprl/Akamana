stages:
  - lint
  - build
  - security

variables:
  CARGO_TERM_COLOR: always

lint:
  stage: lint
  image: rust:1.77-bookworm
  script:
    - cd backend
    - cargo fmt --all --check
    - cargo clippy -- -D warnings

build:
  stage: build
  image: docker:29.1.3
  services:
    - docker:29.1.3-dind
  script:
    - docker build -t ezkey:${CI_COMMIT_SHA} .

security:
  stage: security
  image: rust:1.77-bookworm
  script:
    - cargo install cargo-audit || true
    - cd backend
    - cargo audit || true

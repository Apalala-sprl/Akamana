apiVersion: v1
kind: Pod
metadata:
  name: akamana-pod
  labels:
    app: akamana
spec:
  automountServiceAccountToken: false
  containers:
    - name: mariadb
      image: mariadb:11.4
      # Credentials come from a Secret, not the manifest. Create it with, e.g.:
      #   kubectl create secret generic akamana-mariadb-env \
      #     --from-literal=MARIADB_ROOT_PASSWORD=... --from-literal=MARIADB_DATABASE=akamana \
      #     --from-literal=MARIADB_USER=akamana --from-literal=MARIADB_PASSWORD=...
      envFrom:
        - secretRef:
            name: akamana-mariadb-env
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
          ephemeral-storage: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
      volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
    - name: akamana
      image: registry.local/akamana:0.3.1
      envFrom:
        - secretRef:
            name: akamana-env
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "128Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
          ephemeral-storage: "512Mi"
      ports:
        - containerPort: 8080
  volumes:
    - name: mariadb-data
      hostPath:
        path: /var/lib/akamana-mariadb
        type: DirectoryOrCreate

services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_change_me
      MARIADB_DATABASE: akamana
      MARIADB_USER: akamana
      MARIADB_PASSWORD: akamana_password
    volumes:
      - mariadb_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  akamana:
    image: localhost/akamana:latest
    build: .
    restart: unless-stopped
    depends_on:
      - mariadb
    env_file:
      - ${AKAMANA_HOST_CONFIG_DIR:-/opt/akamana/config}/akamana.env
    environment:
      BIND_ADDR: 127.0.0.1:18080
      ADDONS_DIR: /data/addons
      AKAMANA_DATA_DIR: /data
    ports:
      - "${AKAMANA_HTTP_PORT:-8081}:8081"
    volumes:
      - ${AKAMANA_HOST_DATA_DIR:-/opt/akamana/data}:/data

volumes:
  mariadb_data:

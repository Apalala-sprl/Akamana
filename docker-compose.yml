services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_change_me
      MARIADB_DATABASE: ezkey
      MARIADB_USER: ezkey
      MARIADB_PASSWORD: ezkey_password
    volumes:
      - mariadb_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  ezkey:
    image: localhost/ezkey:latest
    build: .
    restart: unless-stopped
    depends_on:
      - mariadb
    env_file:
      - ${EZKEY_HOST_CONFIG_DIR:-/opt/ezkey/config}/ezkey.env
    environment:
      BIND_ADDR: 127.0.0.1:18080
      ADDONS_DIR: /data/addons
      EZKEY_DATA_DIR: /data
    ports:
      - "${EZKEY_HTTP_PORT:-8081}:8081"
    volumes:
      - ${EZKEY_HOST_DATA_DIR:-/opt/ezkey/data}:/data

volumes:
  mariadb_data:
